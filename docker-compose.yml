services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  research-api:
    build: .
    env_file:
      - .env
    entrypoint: ["python", "-m", "tradingagents.research.service"]
    environment:
      - TRADINGAGENTS_RESEARCH_LISTEN=0.0.0.0:8090
    ports:
      - "8090:8090"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    profiles:
      - research

volumes:
  tradingagents_data:
  ollama_data:
